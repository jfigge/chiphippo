# The gallery's submission service (services/gallery-worker/README.md).
name = "chiphippo-gallery-share"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# The app posts to https://share.chiphippo.com/v1/share (src/app/gallery/sources.js
# SHARE_URL). A custom domain needs chiphippo.com's DNS on Cloudflare; without it,
# use the workers.dev address and change SHARE_URL to match.
routes = [{ pattern = "share.chiphippo.com", custom_domain = true }]

[vars]
SUBMISSION_REPO = "jfigge/chiphippo-gallery-submission"

# The rate limit's counters: a salted hash of an address → shares this hour.
# Created with `npx wrangler kv namespace create RATE` (2026-11-05).
[[kv_namespaces]]
binding = "RATE"
id = "4759101912f24be5a96277b48eccf5d7"

# Cloudflare's rate-limiting binding (wrangler 4.36 or later): counted where
# the request lands, so a volley of shares sent at once is cut off — which the
# KV counter above can't do (src/handler.js BURST_LIMIT / ALL_LIMIT; keep the
# limits here equal to those). `period` is 10 or 60 s only, hence KV for the
# hour. Each namespace_id is any integer not used by another binding on the
# account; the two must differ, or they share counters.
[[ratelimits]]
name = "SHARE_BURST"   # one address (a salted hash of it): 3 shares a minute
namespace_id = "2611"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "SHARE_ALL"     # the whole service: 10 shares a minute
namespace_id = "2612"
simple = { limit = 10, period = 60 }

# Secrets (never in this file): `npx wrangler secret put GITHUB_TOKEN` and
# `npx wrangler secret put RATE_SALT`.
